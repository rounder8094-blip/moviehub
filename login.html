<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Movie<span>Hub</span>
    </div>

</header>


<main class="admin-page">

    <h1>Admin Login</h1>

    <p class="admin-subtitle">
        Login to manage your MovieHub movies.
    </p>


    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            class="watch-btn"
        >
            🔐 Login
        </button>

    </form>

</main>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        try {

            const response =
                await fetch("/api/admin/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });


            const result =
                await response.json();


            if (result.success) {

                window.location.href =
                    "admin.html";

            } else {

                alert(
                    result.message ||
                    "Wrong username or password."
                );

            }


        } catch (error) {

            console.error(error);

            alert(
                "Server se connection nahi ho raha."
            );

        }

    });

</script>

</body>

</html>
